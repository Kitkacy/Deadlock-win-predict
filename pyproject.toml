[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-win-predict"
version = "0.1.0"
description = "Dataset pipeline for Deadlock match win prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "numpy>=1.26",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.scripts]
deadlock-dataset = "deadlock_win_predict.cli:main"

[tool.setuptools.packages.find]
include = ["deadlock_win_predict*"]
